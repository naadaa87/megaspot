<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>주차 DB 업데이트 · 메가스팟 관리자</title><style>body{margin:40px auto;padding:0 20px;max-width:820px;font:16px/1.8 system-ui;color:#222;background:#f7f7f5}main{padding:28px;background:#fff;border:1px solid #ddd;border-radius:12px}button{padding:14px 20px;background:#2851da;color:white;border:0;border-radius:7px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5fa;padding:18px}label{display:block;margin:22px 0}</style><main><a href="/admin/#parking">← 주차권 관리</a><h1>주차 DB 업데이트</h1><p>여러 차량을 한 번에 결제하고 차량별로 등록하기 위한 업데이트입니다.</p><ul><li>기존 주차 주문을 별도 표에 백업합니다.</li><li>주문·알림·구매 내역 링크·관리자 문자 이력을 보존합니다.</li><li>전체 작업을 한 트랜잭션으로 실행하며 오류 시 취소합니다.</li><li>실제 결제·환불·주차 등록·메시지 발송은 실행하지 않습니다.</li></ul><p id="state">현재 상태 확인 중…</p><label><input id="confirm" type="checkbox"> 기존 이력을 보존하는 이번 주차 DB 업데이트를 적용합니다.</label><button id="apply" disabled>백업 후 주차 DB 업데이트 적용</button><pre id="result" aria-live="polite"></pre></main><script>
const state=document.querySelector('#state'),out=document.querySelector('#result'),button=document.querySelector('#apply');
async function api(body){const r=await fetch('/api/parking-upgrade',{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'확인하지 못했습니다.');return d;}
api().then(d=>{state.textContent=d.ready?'업데이트 적용 완료':'기존 이력을 확인했습니다. 업데이트를 적용할 수 있습니다.';out.textContent=JSON.stringify(d,null,2);button.disabled=d.ready;}).catch(e=>state.textContent=e.message+' 관리자 로그인 후 다시 열어 주세요.');
button.onclick=async()=>{if(!document.querySelector('#confirm').checked){state.textContent='기존 이력 보존과 업데이트 적용을 확인해 주세요.';return;}button.disabled=true;state.textContent='백업 및 업데이트 중…';try{const d=await api({version:'20261105_parking_batches',confirm_preserve:true});out.textContent=JSON.stringify(d,null,2);state.textContent=d.ok?'업데이트 적용 완료 · 기존 이력 보존 확인':'업데이트 확인이 필요합니다.';}catch(e){state.textContent=e.message;button.disabled=false;}};
</script></html>
