<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>연결이 끊겼습니다 | 메가스팟 호스트센터</title>
<style>
  :root{--chalk:#F1EFEB;--white:#fff;--ink:#1E2225;--ink-2:#545A5E;--line:#D5D0C8;--cobalt:#1F53D5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--chalk);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all}
  .box{max-width:400px;width:100%;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:28px 22px;text-align:center}
  img{width:64px;height:64px}
  h1{font-size:20px;margin:16px 0 8px}
  p{font-size:15px;line-height:1.7;color:var(--ink-2);margin:0}
  button{margin-top:20px;height:46px;padding:0 22px;border:0;border-radius:8px;background:var(--cobalt);color:#fff;font-size:15px;font-weight:700;font-family:inherit}
</style>
</head>
<body>
<div class="box">
  <img src="/assets/img/brand/host-app-192.png" alt="">
  <h1>인터넷 연결이 끊겼습니다</h1>
  <p>와이파이나 모바일 데이터가 켜져 있는지 확인한 뒤 다시 열어 주세요. 예약과 고객 정보는 서버에 안전하게 저장되어 있습니다.</p>
  <button type="button" onclick="location.href='/host/center/'">다시 열기</button>
</div>
</body>
</html>
